<text x="545" y="470" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">Aggregation</text>
<text x="545" y="508" text-anchor="middle" font-size="30" fill="#5b6672">cAMP chemotaxis</text>
<g transform="translate(890,350) scale(2.1)"><path d="M -29,17 A 29,25 0 0 1 29,17 Z" fill="#9fb8d6" stroke="#0a4f47" stroke-width="1.5"/><line x1="-34" y1="17" x2="34" y2="17" stroke="#0a4f47" stroke-width="1.5"/></g>
