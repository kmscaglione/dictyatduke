<text x="890" y="508" text-anchor="middle" font-size="30" fill="#5b6672">cell-type choice</text>
<g transform="translate(1235,350) scale(2.1)"><path d="M -39,4 C -39,-10 -17,-13 4,-13 C 27,-13 41,-7 41,3 C 41,10 19,13 -6,13 C -25,13 -39,11 -39,4 Z" fill="#9fb8d6" stroke="#0a4f47" stroke-width="1.5"/><path d="M 12,-12.6 C 29,-12 41,-7 41,3 C 41,8 29,11.6 12,12.6 Z" fill="#5f93cb" opacity=".9"/></g>
