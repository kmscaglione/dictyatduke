# dictyBase — reverse-proxy directives for RHEL/AlmaLinux httpd.
#
# Use this when the host ALREADY has a managed <VirtualHost *:443> for the site
# (e.g. Duke OIT's generated /etc/httpd/conf.d/25-dicty.labs.duke.edu-https.conf).
# Do NOT add a second vhost with the same ServerName — fold the directives below
# INTO the existing :443 vhost instead. For a from-scratch/Debian standalone
# vhost, see dicty.apache.conf; for full context see DEPLOY-DUKE.md.
#
# Why proxy everything: dictyBase is NOT static. serve.py (127.0.0.1:8774)
# renders the SPA shell, injects per-route SEO <head> tags, and serves /api/*,
# /sitemap.xml, /robots.txt, byte-range genome reads, gzip and cache headers.
# Serving files straight from DocumentRoot breaks /api/*, deep links like
# /gene/<symbol> and /tools/<x>, and the per-route SEO. So reverse-proxy all
# requests to serve.py. DocumentRoot may stay set (OIT tooling expects it) — the
# "ProxyPass /" takes precedence, so it is effectively bypassed.
#
# Required modules are loaded by default on RHEL httpd: mod_proxy, mod_proxy_http,
# mod_headers. SELinux (enforcing) additionally needs, one time:
#     sudo setsebool -P httpd_can_network_connect 1
# ...or httpd cannot open the connection to the backend and every request 503s.

ProxyRequests Off
ProxyPreserveHost On

# So serve.py builds correct absolute URLs (sitemap/canonical) and knows it's https.
RequestHeader set X-Forwarded-Proto "https"

# timeout=120: the synchronous conservation/BLAST endpoints can run up to ~90s;
# heavy cross-species searches use the async job queue and return fast.
# keepalive=On reuses backend connections (serve.py speaks HTTP/1.1).
ProxyPass        /  http://127.0.0.1:8774/  timeout=120 keepalive=On
ProxyPassReverse /  http://127.0.0.1:8774/

# Curator data upload is capped at 50 MB server-side; allow it at the edge too.
LimitRequestBody 52428800

# NOTE on per-IP rate limiting: behind the proxy serve.py sees every request as
# 127.0.0.1, so its per-IP throttles (BLAST, proxy, upload, login) become global.
# Fine for a small internal site. To restore true per-client limits, serve.py
# needs to read X-Forwarded-For from the trusted proxy (small change — ask).
