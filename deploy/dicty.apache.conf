# dictyBase — Apache reverse-proxy vhost for dicty.labs.duke.edu
#
# This is a STANDALONE vhost (Debian/apache2 flavor: ${APACHE_LOG_DIR}, a2enmod).
# On RHEL/AlmaLinux + httpd where a managed vhost for the site ALREADY exists
# (e.g. Duke's /etc/httpd/conf.d/25-dicty.labs.duke.edu-https.conf), do NOT drop
# this second vhost in — you'd get a duplicate ServerName on :443. Instead fold
# the proxy directives from dicty.httpd-proxy.conf into that existing vhost, and
# run the one-time SELinux step:  sudo setsebool -P httpd_can_network_connect 1
# See DEPLOY-DUKE.md for the Duke-specific recipe.
#
# dictyBase is NOT a static site. serve.py renders the SPA shell, injects
# per-route SEO <head> tags, and serves /api/*, /sitemap.xml, /robots.txt,
# /news.xml, byte-range genome reads, gzip, and cache headers itself. So we
# reverse-proxy EVERYTHING to serve.py rather than serving files from
# DocumentRoot — serving static files directly would break /api/*, deep links
# like /gene/<symbol> and /tools/<x>, and the per-route SEO tags.
#
# Required modules:  sudo a2enmod proxy proxy_http headers rewrite ssl
# Install:           copy to /etc/apache2/sites-available/dicty.conf
#                    (or /etc/httpd/conf.d/dicty.conf on RHEL),
#                    then  sudo a2ensite dicty && sudo systemctl reload apache2
# Adjust the SSL cert paths and log paths to match OIT's conventions.

<VirtualHost *:80>
    ServerName dicty.labs.duke.edu
    # Send everything to HTTPS.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName dicty.labs.duke.edu

    # Nominal — bypassed by the ProxyPass below, but OIT tooling expects it set.
    DocumentRoot /srv/web/dicty.labs.duke.edu/html

    SSLEngine on
    # >>> Adjust to OIT's cert locations (they may provide an include instead) <<<
    SSLCertificateFile    /etc/ssl/certs/dicty.labs.duke.edu.crt
    SSLCertificateKeyFile /etc/ssl/private/dicty.labs.duke.edu.key

    # --- Reverse proxy to the serve.py backend on localhost:8774 ----------
    ProxyRequests Off
    ProxyPreserveHost On
    # So serve.py builds correct absolute URLs (sitemap/canonical) and knows it's https.
    RequestHeader set X-Forwarded-Proto "https"

    # timeout=120: the synchronous conservation/BLAST endpoints can run up to
    # ~90s; the heavy cross-species searches use the async job queue and return
    # fast. keepalive=On reuses backend connections (serve.py speaks HTTP/1.1).
    ProxyPass        /  http://127.0.0.1:8774/  timeout=120 keepalive=On
    ProxyPassReverse /  http://127.0.0.1:8774/

    # Curator data upload is capped at 50 MB server-side; allow it at the edge too.
    LimitRequestBody 52428800

    ErrorLog  ${APACHE_LOG_DIR}/dicty_error.log
    CustomLog ${APACHE_LOG_DIR}/dicty_access.log combined
</VirtualHost>

# NOTE on per-IP rate limiting: behind this proxy serve.py sees every request
# as coming from 127.0.0.1, so its per-IP throttles (BLAST, proxy, upload,
# login) effectively become global. That's fine for a small internal site. To
# restore true per-client limits, serve.py needs to read X-Forwarded-For from
# the trusted proxy — ask Claude to add that (small change) if you want it.
