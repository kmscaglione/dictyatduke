<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">dictyBase architecture and data flow</title>
  <desc id="f1d">Community data sources are transformed by build scripts into versioned static data assets, which a single self-contained service delivers to a web interface, a REST API, and bulk downloads.</desc>
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#012169"/>
    </marker>
  </defs>

  <!-- Data sources -->
  <rect x="24" y="70" width="186" height="286" rx="10" fill="#eef3fb" stroke="#012169" stroke-width="1.5"/>
  <text x="117" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#012169">Community data sources</text>
  <g font-size="12" fill="#1a2b3c">
    <text x="42" y="128">Gene Ontology</text>
    <text x="42" y="153">NCBI</text>
    <text x="42" y="178">UniProt</text>
    <text x="42" y="203">InterPro</text>
    <text x="42" y="228">KEGG</text>
    <text x="42" y="253">OMA</text>
    <text x="42" y="278">Human Phenotype Ontology</text>
    <text x="42" y="303">AlphaFold</text>
    <text x="42" y="328">dictyBase collection</text>
  </g>

  <!-- Static assets -->
  <rect x="262" y="170" width="170" height="92" rx="10" fill="#eef3fb" stroke="#012169" stroke-width="1.5"/>
  <text x="347" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#012169">Static data assets</text>
  <text x="347" y="228" text-anchor="middle" font-size="11" fill="#5b6678">versioned</text>
  <text x="347" y="245" text-anchor="middle" font-size="11" fill="#5b6678">JSON · FASTA · GFF3</text>

  <!-- Service -->
  <rect x="484" y="170" width="186" height="92" rx="10" fill="#012169"/>
  <text x="577" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Single self-contained</text>
  <text x="577" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">service</text>
  <text x="577" y="244" text-anchor="middle" font-size="10.5" fill="#cfe0f2">Python stdlib · no database</text>

  <!-- Outputs -->
  <g>
    <rect x="712" y="126" width="128" height="54" rx="9" fill="#eef3fb" stroke="#00539b" stroke-width="1.5"/>
    <text x="776" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#00539b">Web interface</text>
    <text x="776" y="166" text-anchor="middle" font-size="10.5" fill="#5b6678">single-page app</text>
    <rect x="712" y="189" width="128" height="54" rx="9" fill="#eef3fb" stroke="#00539b" stroke-width="1.5"/>
    <text x="776" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#00539b">REST API</text>
    <text x="776" y="229" text-anchor="middle" font-size="10.5" fill="#5b6678">~40 endpoints</text>
    <rect x="712" y="252" width="128" height="54" rx="9" fill="#eef3fb" stroke="#00539b" stroke-width="1.5"/>
    <text x="776" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#00539b">Bulk downloads</text>
    <text x="776" y="292" text-anchor="middle" font-size="10.5" fill="#5b6678">FASTA · GFF3 · JSON</text>
  </g>

  <!-- Arrows -->
  <g stroke="#012169" stroke-width="1.8" fill="none" marker-end="url(#arw)">
    <line x1="212" y1="216" x2="258" y2="216"/>
    <line x1="434" y1="216" x2="480" y2="216"/>
    <line x1="672" y1="216" x2="708" y2="153"/>
    <line x1="672" y1="216" x2="708" y2="216"/>
    <line x1="672" y1="216" x2="708" y2="279"/>
  </g>
  <text x="235" y="205" text-anchor="middle" font-size="10.5" fill="#5b6678">build</text>
  <text x="235" y="234" text-anchor="middle" font-size="10.5" fill="#5b6678">scripts</text>

  <!-- Footer -->
  <text x="430" y="384" text-anchor="middle" font-size="11" fill="#5b6678">Reproducibly built from source · a single service · no database server or distributed components</text>
</svg>
