<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1430" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-labelledby="gt gd">
<title id="gt">dictyBase 2026 graphical abstract</title>
<desc id="gd">A reimplementation of the Dictyostelium model organism database. The life cycle runs across the top; the resource holds 13,892 gene records, 20 genomes, 3,330 human orthologs, the Dicty Stock Center catalogue, 6,556 developmental movies, and analysis tools. The whole system runs as one self-contained service over static data files, on one modest virtual machine maintained by one part-time person.</desc>
<rect width="1760" height="1430" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a4f47"/></marker></defs>
<text x="58" y="74" font-size="58" font-weight="700" fill="#0a4f47">dictyBase 2026</text>
<text x="58" y="120" font-size="29" fill="#5b6672">A reimplementation of the <tspan font-style="italic">Dictyostelium</tspan> model organism database</text>
<text x="1702" y="52" text-anchor="end" font-size="22" font-weight="700" fill="#0b746a" letter-spacing="0.5">BUILT FROM COMMUNITY DATA SOURCES</text>
<text x="1702" y="88" text-anchor="end" font-size="22" fill="#5b6672">Gene Ontology · NCBI · UniProt · InterPro · KEGG · OMA</text>
<text x="1702" y="118" text-anchor="end" font-size="22" fill="#5b6672">InParanoid · HPO · AlphaFold · legacy dictyBase · Dicty Stock Center</text>
<line x1="58" y1="150" x2="1702" y2="150" stroke="#d7e5e0" stroke-width="2"/>
<g transform="translate(200,350) scale(2.1)"><path d="M -14.04,0.78 C -16.38,-7.8 -8.58,-14.04 -0.78,-12.48 C 6.24,-10.92 10.92,-16.38 15.6,-10.14 C 21.06,-4.68 13.26,0.78 15.6,5.46 C 17.94,11.7 7.02,13.26 -14.04,0.78 Z" fill="#9fb8d6" stroke="#0a4f47" stroke-width="1.4"/><ellipse cx="-30" cy="13" rx="3" ry="1.8" fill="#0b746a" opacity=".8"/><ellipse cx="26" cy="-13" rx="3" ry="1.8" fill="#0b746a" opacity=".8"/><ellipse cx="30" cy="15" rx="3" ry="1.8" fill="#0b746a" opacity=".8"/></g>
<text x="200" y="470" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">Amoebae</text>
<text x="200" y="508" text-anchor="middle" font-size="30" fill="#5b6672">feed on bacteria</text>
