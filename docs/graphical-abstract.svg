<text x="1235" y="508" text-anchor="middle" font-size="30" fill="#5b6672">photo/thermotaxis</text>
<g transform="translate(1580,350) scale(2.1)"><ellipse cx="0" cy="29" rx="21" ry="4" fill="#0a4f47"/><polygon points="-4,27 4,27 2.6,-8 -2.6,-8" fill="#9fb8d6" stroke="#0a4f47" stroke-width="1.3"/><circle cx="0" cy="-19" r="15" fill="#f4c84a" stroke="#d9a92a" stroke-width="1.6"/></g>
<text x="1580" y="470" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">Fruiting body</text>
<text x="1580" y="508" text-anchor="middle" font-size="30" fill="#5b6672">spores disperse</text>
<line x1="315" y1="350" x2="430" y2="350" stroke="#0a4f47" stroke-width="2.6" marker-end="url(#ar)" opacity=".75"/>
<line x1="660" y1="350" x2="775" y2="350" stroke="#0a4f47" stroke-width="2.6" marker-end="url(#ar)" opacity=".75"/>
<line x1="1005" y1="350" x2="1120" y2="350" stroke="#0a4f47" stroke-width="2.6" marker-end="url(#ar)" opacity=".75"/>
