<text x="880.0" y="580" text-anchor="middle" font-size="28" font-style="italic" fill="#5b6672">starvation triggers a 24-hour developmental program; spores germinate and the cycle repeats</text>
<rect x="58" y="640" width="536" height="205" rx="14" fill="#eef4f3" stroke="#cfe0dc" stroke-width="1.5"/>
<text x="326.0" y="722" text-anchor="middle" font-size="68" font-weight="700" fill="#0a4f47">13,892</text>
<text x="326.0" y="770" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">gene records</text>
<text x="326.0" y="814" text-anchor="middle" font-size="30" fill="#5b6672">curated summaries, GO, phenotypes</text>
<rect x="612" y="640" width="536" height="205" rx="14" fill="#eef4f3" stroke="#cfe0dc" stroke-width="1.5"/>
<text x="880.0" y="722" text-anchor="middle" font-size="68" font-weight="700" fill="#0a4f47">20</text>
<text x="880.0" y="770" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">genomes</text>
<text x="880.0" y="814" text-anchor="middle" font-size="30" fill="#5b6672">browsable and downloadable</text>
<rect x="1166" y="640" width="536" height="205" rx="14" fill="#eef4f3" stroke="#cfe0dc" stroke-width="1.5"/>
<text x="1434.0" y="722" text-anchor="middle" font-size="68" font-weight="700" fill="#0a4f47">3,330</text>
<text x="1434.0" y="770" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">human orthologs</text>
<text x="1434.0" y="814" text-anchor="middle" font-size="30" fill="#5b6672">1,502 linked to disease</text>
<rect x="58" y="863" width="536" height="205" rx="14" fill="#eef4f3" stroke="#cfe0dc" stroke-width="1.5"/>
<text x="326.0" y="945" text-anchor="middle" font-size="68" font-weight="700" fill="#0a4f47">7,055</text>
<text x="326.0" y="993" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">strains, 1,265 plasmids</text>
<text x="326.0" y="1037" text-anchor="middle" font-size="30" fill="#5b6672">orderable from the site</text>
<rect x="612" y="863" width="536" height="205" rx="14" fill="#eef4f3" stroke="#cfe0dc" stroke-width="1.5"/>
<text x="880.0" y="945" text-anchor="middle" font-size="68" font-weight="700" fill="#0a4f47">6,556</text>
<text x="880.0" y="993" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">developmental movies</text>
<text x="880.0" y="1037" text-anchor="middle" font-size="30" fill="#5b6672">recovered time-lapse screen</text>
<rect x="1166" y="863" width="536" height="205" rx="14" fill="#eef4f3" stroke="#cfe0dc" stroke-width="1.5"/>
<text x="1434.0" y="945" text-anchor="middle" font-size="68" font-weight="700" fill="#0a4f47">~40</text>
<text x="1434.0" y="993" text-anchor="middle" font-size="34" font-weight="700" fill="#1a2b3c">API endpoints</text>
<text x="1434.0" y="1037" text-anchor="middle" font-size="30" fill="#5b6672">BLAST, enrichment, design tools</text>
<rect x="58" y="1105" width="1644" height="225" rx="16" fill="#0a4f47"/>
<text x="880.0" y="1185" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">One self-contained service over static, reproducibly built data files</text>
<text x="880.0" y="1237" text-anchor="middle" font-size="30" fill="#bcd8d3">No database server. No distributed services.</text>
<text x="880.0" y="1285" text-anchor="middle" font-size="30" font-weight="700" fill="#f4c84a">One modest virtual machine, maintained by one part-time person.</text>
<text x="880.0" y="1384" text-anchor="middle" font-size="34" fill="#1a2b3c">Freely available without registration at <tspan font-weight="700" fill="#0a4f47">https://www.dicty.org</tspan></text>
</svg>